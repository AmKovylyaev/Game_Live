name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run --group dev --locked ruff check .
      - run: uv run --group dev --locked ruff format --check .
      - run: uv run --group dev --locked pytest
