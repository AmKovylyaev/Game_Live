name: Build desktop apps

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS Apple Silicon app
            asset: PixelEcosystem-macos-arm64.zip
          - os: macos-15-intel
            label: macOS Intel app
            asset: PixelEcosystem-macos-x64.zip
          - os: windows-latest
            label: Windows executable
            asset: PixelEcosystem-windows-x64.zip
          - os: ubuntu-latest
            label: Linux executable
            asset: PixelEcosystem-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --group build
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: >-
          uv run --group build --locked pyinstaller --noconfirm --clean --windowed --onedir
          --name PixelEcosystem --distpath "$RUNNER_TEMP/dist" --workpath "$RUNNER_TEMP/build/pyinstaller"
          --specpath "$RUNNER_TEMP/build/pyinstaller" --osx-bundle-identifier io.github.amkovylyaev.pixel-ecosystem main.py
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          find "$RUNNER_TEMP/dist/PixelEcosystem.app" -print0 | xargs -0 xattr -c
          codesign --verify --deep --strict "$RUNNER_TEMP/dist/PixelEcosystem.app"
          mkdir -p release
          cd "$RUNNER_TEMP/dist"
          zip -qry "$GITHUB_WORKSPACE/release/${{ matrix.asset }}" PixelEcosystem.app
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: >-
          uv run --group build --locked pyinstaller --noconfirm --clean --windowed --onefile
          --name PixelEcosystem --distpath dist --workpath build/pyinstaller
          --specpath build/pyinstaller main.py
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/PixelEcosystem.exe -DestinationPath release/${{ matrix.asset }}
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: >-
          uv run --group build --locked pyinstaller --noconfirm --clean --onefile
          --name PixelEcosystem --distpath dist --workpath build/pyinstaller
          --specpath build/pyinstaller main.py
      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/${{ matrix.asset }} PixelEcosystem
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
          fi
